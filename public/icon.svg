<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2A334B" stroke-width="4" />

  <!-- Waveform circular halo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neon)" stroke-width="4" opacity="0.3" stroke-dasharray="12 16" />
  
  <!-- Central Studio Microphone / Soundwave Core -->
  <g filter="url(#glow)">
    <!-- Equalizer / Wave Bars -->
    <rect x="136" y="216" width="16" height="80" rx="8" fill="#00F2FE" />
    <rect x="168" y="176" width="16" height="160" rx="8" fill="#00F2FE" />
    <rect x="200" y="140" width="16" height="232" rx="8" fill="#38BDF8" />
    
    <!-- Central Mic capsule -->
    <rect x="232" y="112" width="48" height="180" rx="24" fill="url(#neon)" />
    <circle cx="256" cy="180" r="12" fill="#FFFFFF" opacity="0.9" />
    
    <rect x="296" y="140" width="16" height="232" rx="8" fill="#F43F5E" />
    <rect x="328" y="176" width="16" height="160" rx="8" fill="#FF0844" />
    <rect x="360" y="216" width="16" height="80" rx="8" fill="#FF0844" />

    <!-- Mic Stand arc -->
    <path d="M 206 240 A 50 50 0 0 0 306 240" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M 256 290 L 256 370" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <rect x="216" y="370" width="80" height="16" rx="8" fill="#FFFFFF" />
  </g>
  
  <!-- Sparkle Accent -->
  <path d="M 390 120 L 396 138 L 414 144 L 396 150 L 390 168 L 384 150 L 366 144 L 384 138 Z" fill="#00F2FE" />
</svg>
